<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hallie">

  <meta name="keywords" content="Hallie, kmf, halalfood, halalmeat, halallamb, halalchicken, halalbeef, halallifestyle, halalkorea, halalmarket, halalshop, halalproducts, halalshopping, seoulhalalfood, muslimfriendly, koreanhalalfood, koreamuslim, halalcertified, halaleats, halalcommunity">
<meta name="naver-site-verification" content="0ff0893b3cc37da8099a98132e71562a9eb6d399" />

  

  <!-- Favicon -->
  <link rel="icon" href="__(1024_x_1024).png" sizes="any"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Hallie – Halal Food Platform" />
  <meta property="og:description" content="Halal-certified foods, with certification information provided only for officially certified products." />
  <meta property="og:image" content="/assets/assets/images/___(1024_x_500).png" /> 
  <meta name="twitter:title" content="Hallie – Halal Food Platform" />
  <meta name="twitter:description" content="Halal-certified foods, with certification information provided only for officially certified products." />
  <meta name="twitter:image" content="/assets/assets/images/___(1024_x_500).png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Hallie – Halal Food Platform </title>
  <meta name="description" content="Halal-certified foods, with certification information provided only for officially certified products." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#14181b">

  <link rel="manifest" href="manifest.json">
  
</head>
